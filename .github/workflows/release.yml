name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            linux: false
            macos: true
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
            linux: false
            macos: true
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            args: --bundles nsis,msi
            linux: false
            macos: false
          - name: Ubuntu x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles deb,appimage
            linux: true
            macos: false
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux build dependencies
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libasound2-dev libayatana-appindicator3-dev \
            libdbus-1-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev \
            libxdo-dev patchelf wget xdg-utils

      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build test artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.macos && '-' || '' }}
        with:
          retryAttempts: 2
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true

      - name: Build release artifacts
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.macos && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: BurplePlayer ${{ github.ref_name }}
          releaseBody: |
            BurplePlayer desktop installers: a local music library inside a pastel swing playground.

            Download the DMG for your Mac architecture, the EXE or MSI for Windows x64,
            the DEB for Ubuntu x64, or the AppImage for other x64 Linux distributions.

            macOS builds are ad-hoc signed but not notarized. Windows installers are unsigned.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          args: ${{ matrix.args }}

  publish:
    name: Publish verified release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish after all platform builds succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
