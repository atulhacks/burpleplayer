[package]
name = "burpleplayer"
version = "0.1.2"
description = "A pastel clay-toy desktop music player"
authors = ["BurplePlayer contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "burpleplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
lofty = "0.25.4"
rustfft = "6.4.1"
souvlaki = "0.8.3"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
walkdir = "2.5.0"
tauri-plugin-dialog = "2.8.1"

[patch.crates-io]
block = { path = "../vendor/block-0.1.6" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
